name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -s bash bin/kikori libexec/* lib/*.sh examples/cleaners/* tests/run.sh tests/stubs/gh
      - name: tests
        run: tests/run.sh
